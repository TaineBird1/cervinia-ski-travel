services:
  - type: web
    name: cervinia-travel-services
    runtime: node
    plan: free
    rootDir: cervinia-shop
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Cervinia Travel Services <onboarding@resend.dev>
      - key: BUSINESS_NAME
        value: Cervinia Travel Services
      - key: BUSINESS_EMAIL
        value: info@cerviniatravelservices.com
      - key: BUSINESS_WHATSAPP
        value: "+39 366 879 4487"
      - key: BUSINESS_ADDRESS
        value: Breuil-Cervinia, Aosta Valley, Italy
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      # Once a Render persistent disk is attached, set DATA_DIR to its mount path
      # (for example /var/data) so enquiries and quote PDFs survive restarts.
      # - key: DATA_DIR
      #   value: /var/data
