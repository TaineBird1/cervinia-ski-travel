<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry Sent | Cervinia Travel Services</title>
<link rel="stylesheet" href="/shop/css/styles.css">
<style>
  .confirm-wrap{max-width:640px; margin:0 auto; padding:80px 24px; text-align:center;}
  .confirm-icon{font-size:3rem; margin-bottom:16px;}
  .confirm-card{
    background:var(--bg-alt); border:1px solid var(--line); border-radius:16px; padding:28px;
    margin-top:32px; text-align:left;
  }
  .confirm-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.94rem;}
  .confirm-row:last-child{border-bottom:none;}
  .confirm-total{font-weight:800; font-size:1.1rem;}
  .download-btn{
    display:inline-block; margin-top:26px; background:var(--blue); color:#fff; padding:14px 28px;
    border-radius:12px; font-weight:800; text-decoration:none;
  }
  .status-msg{color:var(--slate); margin-top:20px;}
</style>

</head>
<body>
  <header><div class="wrap header-inner"><a href="/" class="logo">Cervinia <span>Travel Services</span></a></div></header>

  <div class="confirm-wrap">
    <div class="confirm-icon">🎉</div>
    <h1>Thank you — your enquiry is on its way!</h1>
    <p class="status-msg" id="statusMsg">Finalizing your enquiry…</p>

    <div class="confirm-card" id="orderCard" style="display:none;"></div>

    <a href="#" class="download-btn" id="downloadBtn" style="display:none;">Download Your Quote (PDF)</a>
    <div class="confirm-card" id="bankCard" style="display:none;"></div>
    <p style="margin-top:20px; color:var(--slate); font-size:0.9rem;">No payment has been taken. We've emailed you a copy of this quote — our local team will check availability and be in touch within 24 hours.</p>
    <p style="margin-top:24px;"><a href="/shop" style="color:var(--blue); font-weight:700;">← Back to itinerary builder</a></p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const statusMsg = document.getElementById('statusMsg');
  const orderCard = document.getElementById('orderCard');
  const downloadBtn = document.getElementById('downloadBtn');

  if (!sessionId) {
    statusMsg.textContent = 'No enquiry reference found.';
  } else {
    localStorage.removeItem('cervinia_basket');
    poll(0);
  }

  function poll(attempt) {
    fetch(`/api/order/${sessionId}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.status === 'not_found') {
          statusMsg.textContent = 'We could not find this enquiry here — please check your email for your quote, or contact us on WhatsApp.';
        } else if (data.status === 'paid') {
          renderOrder(data.order);
        } else if (attempt < 10) {
          statusMsg.textContent = 'Preparing your quote…';
          setTimeout(() => poll(attempt + 1), 1500);
        } else {
          statusMsg.textContent = 'Almost ready — refresh in a moment if this doesn\'t update.';
        }
      })
      .catch(() => {
        statusMsg.textContent = 'Could not load your enquiry automatically — check your email or contact us.';
      });
  }

  function renderOrder(order) {
    statusMsg.textContent = `Enquiry reference: ${order.id}`;
    orderCard.style.display = 'block';
    orderCard.innerHTML = order.items.map((item) => `
      <div class="confirm-row">
        <span>${item.name} × ${item.qty}</span>
        <span>€${item.total.toFixed(2)}</span>
      </div>
    `).join('') + `
      <div class="confirm-row confirm-total">
        <span>Estimated Total</span>
        <span>€${order.total.toFixed(2)}</span>
      </div>
    `;
    downloadBtn.href = `/api/invoice/${order.id}`;
    downloadBtn.style.display = 'inline-block';
    showBankDetails(order);
  }

  function showBankDetails(order) {
    fetch('/api/bank-details')
      .then((r) => r.json())
      .then((b) => {
        const rows = [
          ['Account name', b.accountName],
          ['Bank', `${b.bankName}, ${b.bankAddress}`],
          ['Account (Conto)', b.accountNumber],
          ['IBAN', b.ibanGrouped],
          ['BIC / SWIFT', b.bic],
          ['Payment reference', order.id]
        ];
        const bankCard = document.getElementById('bankCard');
        bankCard.innerHTML = `
          <h3 style="margin-bottom:6px;">Prefer to pay by bank transfer?</h3>
          <p style="color:var(--slate); font-size:0.88rem; margin-bottom:10px;">Once we have confirmed your booking you can pay directly into our account. Please only pay after we have confirmed availability and your final price.</p>
        ` + rows.map(([label, value]) => `
          <div class="confirm-row"><span>${label}</span><strong style="text-align:right;">${value}</strong></div>
        `).join('');
        bankCard.style.display = 'block';
      })
      .catch(() => {});
  }
</script>
